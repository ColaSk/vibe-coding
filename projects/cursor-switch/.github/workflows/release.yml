name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sidecar (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/build-server.sh

      - name: Build Python sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-server.ps1

      - name: Verify sidecar binary
        shell: bash
        run: |
          test -e packaging/dist/cursor-switch-server/cursor-switch-server \
            || test -e packaging/dist/cursor-switch-server/cursor-switch-server.exe

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [[ "${{ matrix.platform }}" == mac ]]; then
            npm run dist:mac
          else
            npm run dist:win
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cursor-switch-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.${{ matrix.platform == 'mac' && 'dmg' || 'exe' }}
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
